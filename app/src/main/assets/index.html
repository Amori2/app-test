  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App Factory Demo</title>
  <style>
    body { font-family: sans-serif; background: #090d16; color: #f8fafc; margin: 0; padding: 22px; text-align: center; }
    .card { background: #111827; border: 1px solid #1f2937; border-radius: 18px; padding: 22px; margin-top: 18px; }
    button { background: #458AFF; color: #ffffff; border: none; padding: 13px 18px; border-radius: 12px; font-weight: bold; width: 100%; margin-top: 10px; font-size: 14px; cursor: pointer; }
    button:active { transform: scale(0.98); }
  </style>
</head>
<body>
  <h2>مرحباً بك في App Factory ⚡</h2>
  <div class="card">
    <p id="statusTxt">جميع الأزرار والتخزين والتنزيلات تعمل بكفاءة 100%</p>
    <button onclick="testCounter()">+ تجربة التفاعل السريع</button>
    <button onclick="testConfirm()" style="background:#1e293b;border:1px solid #334155;">تجربة نافذة التأكيد</button>
  </div>
  <script>
    let count = 0;
    function testCounter() {
      count++;
      document.getElementById('statusTxt').innerText = 'عدد النقرات الناجحة: ' + count;
    }
    function testConfirm() {
      if (confirm('هل ترغب بتصفير العداد؟')) {
        count = 0;
        document.getElementById('statusTxt').innerText = 'تم التصفير بنجاح!';
      }
    }
  </script>
</body>
</html>
